<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZ11 AZ11</title>
<meta name="theme-color" content="#0b3b82">
<meta name="application-name" content="AZ11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AZ11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --primary:#0b3b82;
  --primary2:#145ac6;
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#182033;
  --muted:#64748b;
  --border:#dce4ef;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#f59e0b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

header{
  position:sticky;top:0;z-index:100;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 18px;
  gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--primary)}
.logo{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  display:grid;place-items:center;color:#fff;font-size:22px
}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{
  border:none;
  border-radius:10px;
  padding:10px 14px;
  font-weight:700;
  background:var(--primary);
  color:#fff;
}
.btn.secondary{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.orange{background:var(--orange)}
.btn.gray{background:#eef2f7;color:#334155}

.layout{
  display:grid;
  grid-template-columns:240px 1fr;
  min-height:calc(100vh - 70px);
}
aside{
  background:#fff;
  border-right:1px solid var(--border);
  padding:16px;
}
.nav-btn{
  width:100%;
  border:none;
  background:transparent;
  text-align:left;
  padding:12px 13px;
  border-radius:10px;
  margin-bottom:6px;
  font-weight:700;
  color:#334155;
}
.nav-btn:hover,.nav-btn.active{background:#edf4ff;color:var(--primary)}

main{padding:22px}
.page-title{margin:0 0 18px;font-size:28px}

.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,1fr)}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  box-shadow:0 3px 15px rgba(15,23,42,.04);
}
.metric{font-size:30px;font-weight:900;color:var(--primary)}
.muted{color:var(--muted)}
.small{font-size:13px}

.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.filters input,.filters select,.form input,.form select,.form textarea{
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;
  background:#fff;
}
.filters input{min-width:240px;flex:1}

.test-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
.test-card h3{margin:0 0 8px}
.pill{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#edf4ff;
  color:var(--primary);
  font-size:12px;
  font-weight:800;
  margin:0 5px 5px 0;
}
.diff-Hard{background:#fff4dd;color:#995a00}
.diff-Very-Hard{background:#ffe2e2;color:#9f1d1d}
.diff-Medium{background:#e4f7ea;color:#126b37}

.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{background:#f8fafc}

.form{display:grid;gap:12px;max-width:700px}
.form label{font-weight:700}

.exam-wrap{max-width:1200px;margin:auto}
.exam-top{
  position:sticky;top:74px;z-index:50;
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}
.timer{font-weight:900;font-size:22px;color:var(--red)}
.exam-grid{display:grid;grid-template-columns:1fr 290px;gap:14px}
.question-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
}
.q-number{font-weight:900;color:var(--primary);margin-bottom:8px}
.q-text{font-size:19px;line-height:1.5;margin-bottom:16px}
.diagram-box{margin:12px 0 18px;padding:14px;border:1px solid var(--border);border-radius:14px;background:#fbfdff;overflow:auto;text-align:center}.diagram-box svg{max-width:100%;height:auto}
.option{
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  margin:9px 0;
  display:flex;
  gap:10px;
  align-items:flex-start;
}
.option:hover{border-color:#8db3ed;background:#fbfdff}
.image-choice{justify-content:center;align-items:center;min-height:58px;font-size:24px;font-weight:900;letter-spacing:.5px}.image-choice input{transform:scale(1.25)}
.admin-note{background:#eef6ff;border:1px solid #bfdbfe;color:#1e3a8a;padding:12px;border-radius:10px;line-height:1.45}
.palette{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px;
  align-self:start;
  position:sticky;
  top:146px;
}
.palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qbtn{
  border:none;
  border-radius:9px;
  padding:9px 0;
  background:#eef2f7;
}
.qbtn.answered{background:#dff5e8;color:#166534}
.qbtn.review{background:#fff1d3;color:#8a5600}
.qbtn.current{outline:3px solid #86b0ef}
.exam-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}

.result-score{font-size:46px;font-weight:900;color:var(--primary)}
.review-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
}
.correct{color:var(--green);font-weight:800}
.wrong{color:var(--red);font-weight:800}
.bookmark-btn{
  float:right;
  border:none;
  background:transparent;
  font-size:22px;
}
.empty{text-align:center;padding:28px;color:var(--muted)}
.toast{
  position:fixed;
  bottom:18px;right:18px;
  padding:12px 16px;
  border-radius:10px;
  background:#111827;color:#fff;
  opacity:0;transform:translateY(20px);
  transition:.25s;z-index:200;
}
.toast.show{opacity:1;transform:translateY(0)}

.xp-card{background:linear-gradient(135deg,#0b3b82,#6d28d9);color:#fff;border:none}.xp-card .muted{color:#dbeafe}.xp-bar{height:12px;background:rgba(255,255,255,.22);border-radius:999px;overflow:hidden;margin-top:9px}.xp-fill{height:100%;background:#fff;border-radius:999px}.badge-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.badge{padding:7px 10px;border-radius:999px;background:#fff7d6;color:#7c4a00;font-size:12px;font-weight:800}.neet-only{background:#eaf7ef;border:1px solid #b9e3c8;color:#166534;padding:12px 14px;border-radius:12px;margin-bottom:16px;font-weight:700}.source-pyq{background:#ede9fe;color:#5b21b6}.type-statement{background:#e0f2fe;color:#075985}.type-diagram{background:#ffe4e6;color:#9f1239}.type-theory{background:#f1f5f9;color:#334155}.diff-Easy{background:#dcfce7;color:#166534}.performance-canvas{width:100%;height:260px;border:1px solid var(--border);border-radius:14px;background:#fff}.image-preview{max-width:100%;max-height:280px;border:1px solid var(--border);border-radius:12px;margin-top:8px}.diagram-box img{max-width:100%;max-height:420px;object-fit:contain;border-radius:10px}.josh{font-size:20px;font-weight:900;margin:10px 0}.points-pop{font-size:34px;font-weight:900;color:#7c3aed}.subject-strip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.subject-btn{padding:10px 14px;border-radius:999px;border:1px solid var(--border);background:#fff;font-weight:800}.subject-btn:hover{border-color:var(--primary);color:var(--primary)}.download-box{background:linear-gradient(135deg,#f8fafc,#eef2ff)}


@media(max-width:980px){
  .layout{grid-template-columns:1fr}
  aside{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .test-grid{grid-template-columns:repeat(2,1fr)}
  .exam-grid{grid-template-columns:1fr}
  .palette{position:static}
}
@media(max-width:640px){
  main{padding:12px}
  .stats,.test-grid{grid-template-columns:1fr}
  .exam-top{position:static;flex-direction:column;align-items:flex-start}
  .question-card{padding:14px}
  .q-text{font-size:17px}
  .filters input{min-width:100%}
}

.version-chip{display:inline-block;padding:4px 8px;border-radius:999px;background:#e0e7ff;color:#3730a3;font-size:11px;font-weight:900;margin-left:6px}
.section-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.section-tabs .btn{padding:9px 12px}
.test-count{font-weight:900;color:var(--primary)}
.install-card{background:linear-gradient(135deg,#eef6ff,#f4f0ff)}
.chapter-summary{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.chapter-summary span{padding:6px 10px;border-radius:999px;background:#f1f5f9;font-size:12px;font-weight:700}
.my-diagram-card{border:2px dashed #7c3aed;background:#faf7ff}


.mobile-menu-btn{display:none}
.mobile-drawer{display:none}
.mobile-drawer-backdrop{display:none}
@media(max-width:980px){
  .mobile-menu-btn{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:46px;height:46px;padding:0 12px;border:none;border-radius:12px;
    background:var(--primary);color:#fff;font-size:24px;font-weight:900
  }
  .mobile-drawer-backdrop{
    position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:998
  }
  .mobile-drawer{
    position:fixed;top:0;left:0;bottom:0;width:min(86vw,330px);
    background:#fff;z-index:999;padding:16px;overflow:auto;
    box-shadow:12px 0 35px rgba(15,23,42,.22)
  }
  .mobile-drawer.open,.mobile-drawer-backdrop.open{display:block}
  .mobile-drawer-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding-bottom:12px;margin-bottom:10px;border-bottom:1px solid var(--border)
  }
  .mobile-drawer .nav-btn{display:block}
  header{align-items:flex-start}
  .header-actions{justify-content:flex-end}
}


.mobile-bottom-nav{display:none}
@media(max-width:980px){
  body{padding-bottom:74px}
  .mobile-bottom-nav{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    position:fixed;left:0;right:0;bottom:0;z-index:997;
    background:#fff;border-top:1px solid var(--border);
    box-shadow:0 -8px 24px rgba(15,23,42,.10);
    padding:7px 5px max(7px,env(safe-area-inset-bottom));
  }
  .mobile-bottom-nav button{
    border:0;background:transparent;color:#334155;
    padding:6px 2px;border-radius:10px;font-size:11px;font-weight:800;
    display:flex;flex-direction:column;align-items:center;gap:2px
  }
  .mobile-bottom-nav button span:first-child{font-size:20px;line-height:1}
  .mobile-bottom-nav button.active{background:#edf4ff;color:var(--primary)}
}


/* AZ11 scroll stability fix */
html,body{min-height:100%;overflow-x:hidden}
body{overflow-y:auto}
.layout,main{overflow:visible}
@media(max-width:980px){
  main{min-height:100vh;overflow:visible}
  .layout{min-height:100vh;overflow:visible}
}


/* ===== AZ11 COLORFUL UI ONLY — NO FUNCTIONAL CHANGES ===== */

/* ===== NOTES SECTION ONLY ===== */

  background:linear-gradient(135deg,#eef8ff 0%,#f8f1ff 55%,#effff7 100%);
  border:1px solid #d6e6f6;
}
.notes-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

}

  background:#edf4ff;color:#174a94;border:1px solid #d9e7fb
}

}

}
.note-file-preview img{

/* ===== AZ11 FINAL UI ADDITIONS ===== */
.logo{padding:0!important;overflow:hidden;border-radius:50%!important;background:#fff!important}
.logo img{width:100%;height:100%;object-fit:cover;display:block}

/* ===== AZ11 MOBILE FULL-FIT FIX ===== */
html,body,#app{max-width:100%;overflow-x:hidden}
.layout,main,.grid,.stats,.test-grid,.exam-wrap,.exam-grid,.question-card,.palette,.card,.filters,.row,.header-actions,.subject-strip,.section-tabs{min-width:0;max-width:100%}
img,svg,video,iframe{max-width:100%}
.card,.question-card,.review-card,.q-text,.q-number,.small,.muted,p,h1,h2,h3{overflow-wrap:anywhere;word-break:break-word}
.filters input,.filters select,.form input,.form select,.form textarea{max-width:100%;min-width:0}
.pdf-test-viewer{width:100%;max-width:100%;overflow:hidden}
.pdf-test-head{min-width:0;max-width:100%}
@media(max-width:640px){
  header{padding:9px 10px;gap:8px;flex-wrap:wrap}
  .brand{min-width:0;max-width:calc(100% - 56px);align-items:flex-start}
  .brand>div:last-child{min-width:0;overflow-wrap:anywhere}
  .logo{width:40px;height:40px;flex:0 0 40px}
  .header-actions{width:100%;justify-content:flex-start;gap:6px}
  .header-actions .btn{flex:1 1 120px;min-width:0;padding:9px 8px;font-size:13px;white-space:normal}
  main{padding:10px;width:100%}
  .card{padding:13px;border-radius:14px}
  .page-title{font-size:23px;line-height:1.2}
  .subject-strip,.section-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;width:100%}
  .subject-btn,.section-tabs .btn{width:100%;min-width:0;white-space:normal;padding:9px 7px}
  .exam-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
  .exam-actions .btn{width:100%;min-width:0;white-space:normal;padding:9px 7px}
  .palette-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
  .qbtn{min-width:0;padding:8px 0}
  .pdf-test-head{display:flex!important;flex-direction:column;align-items:stretch!important;gap:8px}
  .pdf-test-head .btn{width:100%;text-align:center}
  .pdf-test-viewer iframe{width:100%;height:52vh;min-height:300px}
  .test-card .btn{width:100%;white-space:normal}
  .mobile-drawer{width:min(92vw,330px);max-width:100vw}
}
@media(max-width:380px){
  .subject-strip,.section-tabs{grid-template-columns:1fr}
  .exam-actions{grid-template-columns:1fr}
  .palette-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}

{id:109,subject:'Chemistry',type:'Theory',class:'11',chapter:'Physical Chemistry',topic:'Mole Concept',sub:'Stoichiometry',difficulty:'Hard',q:'The number of moles in 11 g of CO₂ is:',o:['0.25 mol','0.50 mol','1 mol','2 mol'],a:0,e:'Moles = mass/molar mass = 11/44 = 0.25 mol.',concept:'Mole concept'},

function makeDiagramQuestions(){
  const out=[]; let id=5000;
  const add=(subject,cls,chapter,topic,diff,diagram,q,o,a,e,concept)=>out.push({id:id++,subject,type:'Diagram',class:cls,chapter,topic,sub:'Diagram Based',difficulty:diff,diagram,q,o,a,e,concept,source:'Original Practice'});
  // Biology - 18
  add('Biology','11','Cell Structure and Function','Cell: The Unit of Life','Easy',DIAGRAMS.bioCell,'Label A represents the large central organelle. Identify it.',['Nucleus','Golgi body','Lysosome','Peroxisome'],0,'The large central oval structure with a dense internal body represents the nucleus.','Cell organelles');
  add('Biology','11','Cell Structure and Function','Cell: The Unit of Life','Hard',DIAGRAMS.bioCell,'If label B represents a mitochondrion, which process is directly associated with it?',['Glycolysis only','Oxidative phosphorylation','DNA packaging in nucleus','Secretion through Golgi'],1,'Mitochondria are major sites of aerobic respiration and oxidative phosphorylation.','Mitochondria');
  add('Biology','11','Cell Structure and Function','Cell: The Unit of Life','Very Hard',DIAGRAMS.bioCell,'Which labelled organelle would most directly contain its own circular DNA if B is mitochondrion?',['A only','B','C only','D only'],1,'Mitochondria possess their own circular DNA and ribosomes.','Semiautonomous organelles');
  add('Biology','11','Cell Structure and Function','Cell: The Unit of Life','Hard',DIAGRAMS.bioCell,'A drug blocking ribosomal protein synthesis would most directly affect which cell function before nuclear DNA replication?',['Translation','Transcription','DNA replication','Chromosome segregation'],0,'Ribosomes carry out translation.','Ribosomes');
  add('Biology','11','Cell Structure and Function','Cell: The Unit of Life','Hard',DIAGRAMS.bioCell,'Which organelle is expected to modify and package secretory proteins?',['Nucleus','Golgi apparatus','Centriole','Nucleolus'],1,'Golgi apparatus modifies, sorts and packages proteins for secretion.','Golgi apparatus');
  add('Biology','11','Cell Structure and Function','Cell: The Unit of Life','Very Hard',DIAGRAMS.bioCell,'A eukaryotic cell loses functional lysosomes. Which process is most directly impaired?',['Intracellular digestion','DNA replication','Spindle formation only','Transcription'],0,'Lysosomes contain hydrolytic enzymes for intracellular digestion.','Lysosomes');
  add('Biology','11','Human Physiology','Excretory Products and their Elimination','Easy',DIAGRAMS.bioNephron,'In the nephron diagram, A represents the renal corpuscle region. Filtration begins primarily at the:',['Glomerulus','Collecting duct','Loop of Henle','DCT'],0,'Ultrafiltration occurs through glomerular capillaries into Bowman’s capsule.','Glomerular filtration');
  add('Biology','11','Human Physiology','Excretory Products and their Elimination','Hard',DIAGRAMS.bioNephron,'Which nephron region is most important for establishing the counter-current gradient?',['Bowman capsule','Loop of Henle','PCT only','Ureter'],1,'The loop of Henle is central to the counter-current multiplier mechanism.','Counter-current mechanism');

function makeStatementQuestions(){
  const out=[];let id=7000;
  const add=(subject,cls,chapter,topic,diff,s1,s2,ans,e,concept)=>out.push({id:id++,subject,type:'Statement',class:cls,chapter,topic,sub:'Statement Based',difficulty:diff,q:`Consider the following statements:<br><b>I.</b> ${s1}<br><b>II.</b> ${s2}<br>Choose the correct option.`,o:['Statement I only is correct','Statement II only is correct','Both statements are correct','Neither statement is correct'],a:ans,e,concept,source:'Original Practice'});
  // Biology 10
  add('Biology','11','Human Physiology','Body Fluids and Circulation','Hard','P wave represents atrial depolarisation.','T wave represents ventricular repolarisation.',2,'Both statements correctly describe ECG components.','ECG');
  add('Biology','11','Human Physiology','Breathing and Exchange of Gases','Very Hard','Most CO₂ is transported as bicarbonate ions.','High CO₂ generally increases haemoglobin affinity for O₂.',0,'Statement I is correct; high CO₂ lowers O₂ affinity and promotes unloading.','Gas transport');
  add('Biology','11','Plant Physiology','Photosynthesis in Higher Plants','Hard','Oxygen evolved in photosynthesis comes from water.','RuBP is the primary CO₂ acceptor in C3 plants.',2,'Both are standard photosynthesis concepts.','Photosynthesis');
  add('Biology','11','Human Physiology','Excretory Products and their Elimination','Very Hard','Descending limb is highly permeable to water.','Ascending limb is highly permeable to water.',0,'Descending limb loses water; ascending limb is relatively impermeable to water.','Loop of Henle');
  add('Biology','12','Genetics and Evolution','Molecular Basis of Inheritance','Hard','DNA synthesis proceeds 5′→3′.','DNA polymerase adds nucleotides to the 5′ end of a growing strand.',0,'DNA polymerase adds to the 3′-OH end, causing 5′→3′ synthesis.','DNA replication');
  add('Biology','12','Biology and Human Welfare','Human Health and Disease','Hard','Plasma cells secrete antibodies.','Helper T cells are important coordinators of adaptive immune responses.',2,'Both statements are correct.','Immunity');
  add('Biology','12','Reproduction','Human Reproduction','Hard','LH surge triggers ovulation.','Spermiogenesis is release of spermatozoa from Sertoli cells.',0,'Spermiogenesis is differentiation of spermatids; spermiation is release.','Reproduction');
  add('Biology','12','Ecology and Environment','Ecosystem','Very Hard','Energy pyramid is always upright.','Energy transfer between trophic levels is 100% efficient.',0,'Energy decreases at higher trophic levels; transfer is far below 100%.','Energy flow');
  add('Biology','11','Diversity in Living World','Plant Kingdom','Easy','Bryophytes require water for fertilisation.','Bryophytes produce seeds enclosed in fruits.',0,'Bryophytes need water for sexual reproduction but do not form seeds/fruits.','Bryophytes');
  add('Biology','12','Biotechnology','Biotechnology: Principles and Processes','Hard','Taq polymerase is thermostable.','Restriction endonucleases recognise specific DNA sequences.',2,'Both are core tools used in biotechnology.','Biotechnology tools');
  // Chemistry 10
  add('Chemistry','12','Physical Chemistry','Chemical Kinetics','Hard','First-order half-life is independent of initial concentration.','Its half-life equals 0.693/k.',2,'Both are true for first-order reactions.','First-order kinetics');
  add('Chemistry','12','Physical Chemistry','Electrochemistry','Very Hard','Increasing reaction quotient Q lowers Ecell under Nernst conditions.','A spontaneous galvanic cell has positive Ecell.',2,'Both follow electrochemical thermodynamics.','Nernst equation');
  add('Chemistry','11','Physical Chemistry','Equilibrium','Hard','A catalyst changes the rate of attaining equilibrium.','A catalyst changes the equilibrium constant at fixed temperature.',0,'Catalyst speeds both directions but does not change K.','Chemical equilibrium');
  add('Chemistry','11','Physical Chemistry','Thermodynamics','Hard','For an ideal gas, internal energy depends only on temperature.','During isothermal ideal-gas expansion ΔU=0.',2,'Both statements are correct.','Thermodynamics');
  add('Chemistry','12','Organic Chemistry','Alcohols Phenols and Ethers','Very Hard','Phenoxide ion is resonance stabilised.','Phenol is generally more acidic than ethanol.',2,'Resonance stabilisation of phenoxide explains the acidity difference.','Phenol acidity');
  add('Chemistry','12','Inorganic Chemistry','Coordination Compounds','Hard','NH₃ is a monodentate ligand.','[Co(NH₃)₆]³⁺ has coordination number 6.',2,'Both are correct.','Coordination chemistry');
  add('Chemistry','11','Physical Chemistry','Atomic Structure','Easy','For a d orbital, l=2.','For a p orbital, l=0.',0,'p has l=1, not 0.','Quantum numbers');
  add('Chemistry','11','Organic Chemistry','Hydrocarbons','Hard','HBr adds to propene by Markovnikov orientation in absence of peroxide.','Peroxide effect is characteristically observed with HBr.',2,'Both are correct.','Addition reactions');

  add('Chemistry','12','Physical Chemistry','Solutions','Hard','Osmotic pressure is a colligative property.','It is useful for molar-mass determination of macromolecules.',2,'Both statements are correct.','Osmotic pressure');

  add('Physics','11','Mechanics','Work Energy and Power','Hard','Net work equals change in kinetic energy.','A force perpendicular to displacement does zero work.',2,'Both are standard results.','Work-energy theorem');
  add('Physics','12','Electrostatics','Electric Charges and Fields','Hard','Coulomb force varies as inverse square of separation.','Doubling separation makes force one-half.',0,'It becomes one-fourth, so only statement I is correct.','Coulomb law');
  add('Physics','12','Magnetism','Moving Charges and Magnetism','Hard','Magnetic force on a charge moving parallel to B is zero.','Magnetic force can change speed of a charge in a uniform B field.',0,'Magnetic force is perpendicular to velocity and does no work, so speed is unchanged.','Lorentz force');

function seededShuffleOptions(base,seed){
  const arr=base.o.map((text,i)=>({text,i}));
  let x=(base.id*9301+seed*49297)%233280;
  for(let i=arr.length-1;i>0;i--){x=(x*9301+49297)%233280;const j=x%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}
  return {o:arr.map(v=>v.text),a:arr.findIndex(v=>v.i===base.a)};
}
function expandBank(){

    });
  });
  return bank;
}

async function syncRemoteQuestions(showToast=false){
  if(!(location.protocol==='https:'||location.hostname==='localhost'))return false;
  try{
    const r=await fetch('/api/questions?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    const arr=Array.isArray(data)?data:(data.questions||[]);
    saveRemoteQuestions(arr);
    if(showToast)toast(`Synced ${arr.length} questions`);
    return true;
  }catch(e){
    if(showToast)toast('Could not sync questions. Offline bank is still available.');
    return false;
  }
}

function questionFileDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('az11_question_files_v1',1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('files'))db.createObjectStore('files',{keyPath:'id'})};
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  });
}
async function cacheQuestionFile(id,blob,name,type){
  try{
    const db=await questionFileDB();
    await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put({id:String(id),blob,name,type});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
    db.close();
  }catch(e){}
}
async function getCachedQuestionFile(id){
  try{
    const db=await questionFileDB();
    const x=await new Promise((res,rej)=>{const tx=db.transaction('files','readonly');const r=tx.objectStore('files').get(String(id));r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)});
    db.close();return x;
  }catch(e){return null}
}
async function fetchQuestionFile(q){
  let cached=await getCachedQuestionFile(q.id);
  if(cached)return cached;
  if(!navigator.onLine)return null;

  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),15000);
  try{
    const r=await fetch(`/api/question-file?id=${encodeURIComponent(q.id)}&ts=${Date.now()}`,{
      cache:'no-store',
      signal:controller.signal
    });
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const blob=await r.blob();
    if(!blob || !blob.size)throw new Error('Empty question file');
    cached={id:String(q.id),blob,name:q.fileName||'question-file',type:q.fileType||blob.type};
    await cacheQuestionFile(q.id,blob,cached.name,cached.type);
    return cached;
  }catch(e){
    console.error('AZ11 question file load failed',q.id,e);
    return null;
  }finally{
    clearTimeout(timer);
  }
}
async function renderVisibleQuestionFiles(){
  const els=[...document.querySelectorAll('[data-qfile]')];
  for(const el of els){
    const id=el.getAttribute('data-qfile');

    // The current exam question is the most reliable source.
    const q=
      (state.exam?.questions||[]).find(x=>String(x.id)===String(id)) ||
      getRemoteQuestions().find(x=>String(x.id)===String(id)) ||
      allQuestions().find(x=>String(x.id)===String(id)) ||
      AZ11_FULL_BANK.find(x=>String(x.id)===String(id));

    if(!q){
      el.innerHTML='<div class="small muted">Question data could not be found. Refresh the app once.</div>';
      continue;
    }
    if(!q.hasFile){
      el.innerHTML='<div class="small muted">This question has no attached image/PDF.</div>';
      continue;
    }

    const f=await fetchQuestionFile(q);
    if(!f){
      el.innerHTML='<div class="small muted">⚠️ Question image/PDF could not load. Re-upload this file once from Owner Admin, then refresh.</div>';
      continue;
    }

    const url=URL.createObjectURL(f.blob);
    if((f.type||'').startsWith('image/')){
      el.innerHTML=`<img src="${url}" alt="Question image" style="max-width:100%;max-height:620px;object-fit:contain;border-radius:14px">`;
    }else if((f.type||'')==='application/pdf'){
      el.innerHTML=`<div class="file-question"><iframe src="${url}" title="Question PDF"></iframe></div>`;
    }else{
      el.innerHTML=`<a class="btn secondary" href="${url}" target="_blank" download="${esc(f.name||'question-file')}">Open question file</a>`;
    }
  }
}

let accountState={user:null,attempts:[]};
async function loadAccount(){
  if(!(location.protocol==='https:'||location.hostname==='localhost'))return false;
  try{
    const r=await fetch('/api/auth',{cache:'no-store',credentials:'same-origin'});
    if(!r.ok){accountState={user:null,attempts:[]};return false}
    const d=await r.json();accountState.user=d.user||null;
    if(accountState.user)await loadServerAttempts();
    return !!accountState.user;
  }catch(e){return false}
}
async function registerAccount(){
  const username=(document.getElementById('regUser')?.value||'').trim();
  const password=document.getElementById('regPass')?.value||'';
  const displayName=(document.getElementById('regName')?.value||'').trim();
  try{
    const r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({action:'register',username,password,displayName})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Registration failed');
    accountState.user=d.user;toast('Account created');await loadServerAttempts();render();
  }catch(e){toast(e.message)}
}
async function loginAccount(){
  const username=(document.getElementById('loginUser')?.value||'').trim();
  const password=document.getElementById('loginPass')?.value||'';
  try{
    const r=await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({action:'login',username,password})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Login failed');
    accountState.user=d.user;toast('Logged in');await loadServerAttempts();await syncPendingAttempts();render();
  }catch(e){toast(e.message)}
}
async function logoutAccount(){
  try{await fetch('/api/auth',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({action:'logout'})})}catch(e){}
  accountState={user:null,attempts:[]};render();toast('Logged out');
}
async function loadServerAttempts(){
  if(!accountState.user)return;
  try{
    const r=await fetch('/api/progress',{cache:'no-store',credentials:'same-origin'});
    if(r.ok){const d=await r.json();accountState.attempts=d.attempts||[]}
  }catch(e){}
}

  if(!accountState.user)return;
  const summary={id:String(result.id),name:result.name,date:result.date,score:result.score,total:result.total,correct:result.correct,wrong:result.wrong,unattempted:result.unattempted,accuracy:result.accuracy,points:result.points};
  try{
    const r=await fetch('/api/progress',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify(summary)});
    if(!r.ok)throw new Error('sync');
  }catch(e){
    const q=pendingAttempts();if(!q.some(x=>x.id===summary.id))q.push(summary);savePendingAttempts(q);
  }
}
async function syncPendingAttempts(){
  if(!accountState.user||!navigator.onLine)return;
  const list=pendingAttempts(),remain=[];
  for(const a of list){
    try{
      const r=await fetch('/api/progress',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify(a)});
      if(!r.ok)remain.push(a);
    }catch(e){remain.push(a)}
  }
  savePendingAttempts(remain);
  await loadServerAttempts();
}

const CATALOG_SET=new Set(CHAPTER_CATALOG.map(x=>x.subject+'|||'+x.chapter));
function canonicalChapter(q){
  if(!q)return null;
  if(CATALOG_SET.has(q.subject+'|||'+q.chapter))return q.chapter;
  if(CATALOG_SET.has(q.subject+'|||'+q.topic))return q.topic;
  const a=CHAPTER_ALIASES[q.topic]||CHAPTER_ALIASES[q.chapter];
  if(a&&CATALOG_SET.has(q.subject+'|||'+a))return a;
  return null;
}
function normalizeQuestion(q){
  const ch=canonicalChapter(q);
  return ch?{...q,chapter:ch}:null;
}

function allQuestions(){
  const builtIn=QUESTION_BANK.filter(q=>q.type!=='Diagram');
  const remote=getRemoteQuestions();
  const all=[...builtIn,...AZ11_FULL_BANK,...remote].map(normalizeQuestion).filter(Boolean);
  const seen=new Set(),out=[];
  for(const q of all){
    const key=(String(q.q||'').trim().toLowerCase().replace(/\s+/g,' ')+'|'+String(q.paperSection||q.subject));
    if(seen.has(key))continue;seen.add(key);out.push(q);
  }
  return out;
}

function stripQuestionForSession(q){
  const x={...q};
  if(x.imageData)delete x.imageData;
  if(x.diagram)delete x.diagram;
  return x;
}
function restoreQuestionFromSession(saved){
  const bank=allQuestions();
  const src=bank.find(q=>q.id===saved.id) || bank.find(q=>saved.baseId && (q.id===saved.baseId || q.baseId===saved.baseId));
  return src?{...src,...saved,imageData:src.imageData||saved.imageData||null,diagram:src.diagram||saved.diagram||null}:saved;
}

function clearSavedExam(){
  state.exam=null;state.current=0;state.answers=[];state.review=[];state.visited=[];state.questionTime=[];state.questionStartedAt=null;
  state.deadline=null;state.seconds=0;
}
function restoreSession(){
  try{
    const raw=localStorage.getItem(STORE.session);
    if(!raw)return false;
    const snap=JSON.parse(raw);
    if(!snap||typeof snap!=='object')return false;

    const validPages=new Set(['dashboard','dailyplan','weak','revision','analysis','fulltests','tests','chaptertests','diagrams','pdftests','pyq','custom','friendgame','performance','history','wrong','bookmarks','notes','account','about','exam','result']);
    state.page=validPages.has(snap.page)?snap.page:'dashboard';

    if(snap.lastResultId){
      state.lastResult=getResults().find(r=>r.id===snap.lastResultId)||null;
    }else if(state.page==='result'){
      const rr=getResults();
      state.lastResult=rr.length?rr[rr.length-1]:null;
    }

    if(snap.exam && Array.isArray(snap.exam.questions) && snap.exam.questions.length){
      state.exam={
        name:snap.exam.name||'Saved NEET Test',
        minutes:Number(snap.exam.minutes)||20,
        mode:snap.exam.mode||'',lockMode:!!snap.exam.lockMode,meta:snap.exam.meta||{},
        questions:snap.exam.questions.map(restoreQuestionFromSession)
      };
      state.current=Math.min(Math.max(0,Number(snap.current)||0),state.exam.questions.length-1);

      state.answers=Array.isArray(snap.answers)?snap.answers.slice(0,state.exam.questions.length):[];
      while(state.answers.length<state.exam.questions.length)state.answers.push(null);

      state.review=Array.isArray(snap.review)?snap.review.slice(0,state.exam.questions.length):[];
      while(state.review.length<state.exam.questions.length)state.review.push(false);

      state.visited=Array.isArray(snap.visited)?snap.visited.slice(0,state.exam.questions.length):[];
      while(state.visited.length<state.exam.questions.length)state.visited.push(false);
      state.visited[state.current]=true;

      state.questionTime=Array.isArray(snap.questionTime)?snap.questionTime.slice(0,state.exam.questions.length).map(x=>Number(x)||0):[];
      while(state.questionTime.length<state.exam.questions.length)state.questionTime.push(0);
      state.questionStartedAt=Date.now();

      state.deadline=Number(snap.deadline)||null;
      if(state.deadline){
        state.seconds=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));
      }else{
        state.seconds=Math.max(0,Number(snap.seconds)||state.exam.minutes*60);
        state.deadline=Date.now()+state.seconds*1000;
      }
      if(snap.page==='exam')state.page='exam';
    }else if(state.page==='exam'){
      state.page='dashboard';
    }
    return true;
  }catch(e){
    return false;
  }
}
function syncExamClock(){
  if(!state.exam||!state.deadline)return;
  state.seconds=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));
}


function pointsForResult(r){
  if(r.points!=null)return r.points;
  return Math.max(0,(r.correct||0)*20-(r.wrong||0)*5+(r.accuracy>=90?120:r.accuracy>=80?70:r.accuracy>=70?35:0));
}
function profileStats(){
  const r=getResults();
  const points=r.reduce((s,x)=>s+pointsForResult(x),0);
  let streak=0;for(let i=r.length-1;i>=0;i--){if((r[i].accuracy||0)>=70)streak++;else break}
  const levels=[['NEET Starter',0],['Concept Fighter',600],['NEET Warrior',1600],['Rank Booster',3500],['PCB Beast',6500],['NEET Legend',10000]];
  let level=levels[0],next=levels[1];for(let i=0;i<levels.length;i++){if(points>=levels[i][1]){level=levels[i];next=levels[i+1]||[levels[i][0],levels[i][1]+5000]}}
  const pct=Math.min(100,Math.round((points-level[1])/(next[1]-level[1])*100));
  return {points,streak,level:level[0],next:next[1],pct};
}
function badges(){const r=getResults(),p=profileStats(),b=[];if(r.length>=1)b.push('First Test ✅');if(r.length>=5)b.push('5 Test Streak 🧠');if(r.some(x=>x.accuracy>=90))b.push('90% Club 🔥');if(p.points>=1600)b.push('NEET Warrior ⚔️');if(r.some(x=>x.wrong===0&&x.unattempted===0))b.push('Perfect Test 💯');return b}

function ymdLocal(d=new Date()){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function addDaysYMD(ymd,n){
  const [y,m,d]=ymd.split('-').map(Number);
  const x=new Date(y,m-1,d);
  x.setDate(x.getDate()+n);
  return ymdLocal(x);
}
function updateDailyStreak(){
  let s={last:'',streak:0,best:0,coins:0};
  try{s={...s,...JSON.parse(localStorage.getItem(AZ11_STREAK_KEY)||'{}')}}catch(e){}
  const today=ymdLocal();
  if(s.last!==today){
    if(s.last && addDaysYMD(s.last,1)===today) s.streak=Number(s.streak||0)+1;
    else s.streak=1;
    s.best=Math.max(Number(s.best||0),s.streak);
    s.coins=Number(s.coins||0)+10;
    s.last=today;
    localStorage.setItem(AZ11_STREAK_KEY,JSON.stringify(s));
  }
  return s;
}

function resultTime(r){

}
function progressBar(v,max){
  const pct=max?Math.min(100,Math.round(v/max*100)):0;
  return `<div class="az11-progress"><div style="width:${pct}%"></div></div>`;
}
function dailyProgress(){

function weakAreaStats(){
  const map=new Map();
  for(const r of getResults()){
    for(const d of (r.details||[])){
      if(!d?.q||d.status==='unattempted')continue;
      const q=d.q,key=[q.subject||'',q.chapter||'',q.topic||''].join('|||');
      if(!map.has(key))map.set(key,{subject:q.subject||'',chapter:q.chapter||'',topic:q.topic||'',attempts:0,correct:0,wrong:0});
      const x=map.get(key);x.attempts++;
      if(d.status==='correct')x.correct++;else if(d.status==='wrong')x.wrong++;
    }
  }
  return [...map.values()].map(x=>({...x,accuracy:x.attempts?Math.round(x.correct/x.attempts*100):0}))
    .sort((a,b)=>a.accuracy-b.accuracy||b.wrong-a.wrong||b.attempts-a.attempts);
}
function smartPracticeQuestions(area,count=20){
  let pool=allQuestions().filter(q=>
    (!area.subject||q.subject===area.subject)&&
    (!area.chapter||q.chapter===area.chapter)&&
    (!area.topic||q.topic===area.topic)&&q.type!=='Diagram'
  );
  if(pool.length<count)pool=allQuestions().filter(q=>
    (!area.subject||q.subject===area.subject)&&
    (!area.chapter||q.chapter===area.chapter)&&q.type!=='Diagram'
  );
  const seen=new Set(),out=[];
  for(const q of pool.slice().sort(()=>Math.random()-.5)){
    const k=String(q.q||'').trim().toLowerCase().replace(/\s+/g,' ');
    if(!k||seen.has(k))continue;seen.add(k);out.push(clone(q));
    if(out.length>=count)break;
  }
  return out.map((q,i)=>({...q,runId:i+1}));
}
function startWeakArea(i){
  const area=weakAreaStats()[Number(i)];
  if(!area)return toast('Weak topic not found.');
  const qs=smartPracticeQuestions(area,20);
  if(!qs.length)return toast('No practice questions available yet.');
  startExam(`Smart Weak Topic • ${area.chapter} • ${area.topic}`,qs,20,{mode:'weak',meta:{area}});
}

function mistakeItems(){
  const map=new Map();
  for(const r of getResults()){
    for(const d of (r.details||[])){
      if(d.status!=='wrong'||!d.q)continue;
      const key=String(d.q.baseId||d.q.id||d.q.q);
      const old=map.get(key)||{q:d.q,count:0,lastAns:d.ans,lastAt:0};
      old.count++;old.q=d.q;old.lastAns=d.ans;old.lastAt=Math.max(old.lastAt,resultTime(r));
      map.set(key,old);
    }
  }
  return [...map.values()].sort((a,b)=>b.lastAt-a.lastAt||b.count-a.count);
}

function getRevisionQueue(){
  let q=[];
  try{q=JSON.parse(localStorage.getItem(AZ11_REVISION_KEY)||'[]')}catch(e){}
  if(!Array.isArray(q))q=[];
  if(!localStorage.getItem(AZ11_REVISION_BOOT)){
    const now=Date.now(),seen=new Set(q.map(x=>String(x.key)));
    for(const x of mistakeItems()){
      const key=String(x.q.baseId||x.q.id);
      if(seen.has(key))continue;
      q.push({key,questionId:String(x.q.id),stage:0,nextDue:now,addedAt:now,lastStatus:'historical'});
      seen.add(key);
    }
    localStorage.setItem(AZ11_REVISION_BOOT,'1');
    localStorage.setItem(AZ11_REVISION_KEY,JSON.stringify(q));
  }
  return q;
}
function saveRevisionQueue(q){localStorage.setItem(AZ11_REVISION_KEY,JSON.stringify(q))}
function scheduleWrongQuestions(details,at=Date.now()){
  let q=getRevisionQueue();
  for(const d of details||[]){
    if(d.status!=='wrong'||!d.q)continue;
    const key=String(d.q.baseId||d.q.id),id=String(d.q.id);
    let x=q.find(z=>String(z.key)===key);
    if(!x){x={key,questionId:id,stage:0,addedAt:at};q.push(x)}
    x.questionId=id;x.stage=0;x.lastStatus='wrong';x.nextDue=at+REVISION_DAYS[0]*86400000;
  }
  saveRevisionQueue(q);
}
function updateRevisionAfterResult(details,at=Date.now()){
  let q=getRevisionQueue();
  for(const d of details||[]){
    if(!d.q)continue;
    const key=String(d.q.baseId||d.q.id);
    const x=q.find(z=>String(z.key)===key);
    if(!x)continue;
    if(d.status==='correct'){
      x.stage=Number(x.stage||0)+1;x.lastStatus='correct';
      if(x.stage>=REVISION_DAYS.length){
        q=q.filter(z=>String(z.key)!==key);
      }else{
        x.nextDue=at+REVISION_DAYS[x.stage]*86400000;
      }
    }else if(d.status==='wrong'){
      x.stage=0;x.lastStatus='wrong';x.nextDue=at+REVISION_DAYS[0]*86400000;
    }
  }
  saveRevisionQueue(q);
}
function revisionQuestion(x){
  const bank=allQuestions();
  return bank.find(q=>String(q.id)===String(x.questionId))||
         bank.find(q=>String(q.baseId||q.id)===String(x.key))||null;
}

function isFullResult(r){return Number(r.total)===180||/Full Mock|180 Questions/i.test(r.name||'')}
function chapterStrength(details){
  const map=new Map();
  for(const d of details||[]){
    if(!d.q||d.status==='unattempted')continue;
    const k=`${d.q.subject||''} • ${d.q.chapter||'Unknown'}`;
    if(!map.has(k))map.set(k,{name:k,c:0,t:0,w:0});
    const x=map.get(k);x.t++;if(d.status==='correct')x.c++;if(d.status==='wrong')x.w++;
  }
  const a=[...map.values()].map(x=>({...x,acc:x.t?Math.round(x.c/x.t*100):0})).sort((a,b)=>b.acc-a.acc||b.t-a.t);
  return {strong:a[0]||null,weak:a.slice().sort((a,b)=>a.acc-b.acc||b.w-a.w)[0]||null};
}
function fullResultAnalysis(r){
  const sections=['Physics','Chemistry','Botany','Zoology'];
  const sec=sections.map(s=>{
    const d=(r.details||[]).filter(x=>questionSection(x.q)===s);
    const c=d.filter(x=>x.status==='correct').length,w=d.filter(x=>x.status==='wrong').length,u=d.length-c-w;
    const time=d.reduce((sum,x)=>sum+Number(x.timeSpent||0),0);
    return {s,c,w,u,total:d.length,score:c*4-w,time,avg:d.length?Math.round(time/d.length):0};
  });
  const cs=chapterStrength(r.details||[]);
  const avg=r.total?Math.round(Number(r.used||0)/r.total):0;
  return {sec,cs,avg,negative:Number(r.wrong||0)};
}

function buildTestLibrary(){
  const tests=[];let id=1;
  const diffs=['Easy','Hard','Very Hard'];

  // 180 subject full tests: 60 Biology + 60 Chemistry + 60 Physics.
  for(const subject of ['Biology','Chemistry','Physics']){
    for(let n=1;n<=60;n++){
      const difficulty=diffs[(n-1)%3];
      tests.push({id:id++,scope:'Full',name:`${subject} Full NEET Test ${n}`,subject,difficulty,type:'All',source:'All',minutes:20});
    }
  }

  // 30 additional PCB mixed all-over tests.
  for(let n=1;n<=30;n++){
    const difficulty=diffs[(n-1)%3];
    tests.push({id:id++,scope:'Full',name:`PCB All-Over NEET Test ${n}`,subject:'PCB Mixed',difficulty,type:'All',source:'All',minutes:20});
  }

  // Chapter-wise tests from the exact 72-chapter NEET catalog supplied for AZ11.
  for(const item of CHAPTER_CATALOG){
    for(const difficulty of diffs){
      for(let n=1;n<=3;n++){
        tests.push({
          id:id++,scope:'Chapter',
          name:`${item.chapter} • ${difficulty} Test ${n}`,
          subject:item.subject,chapter:item.chapter,group:item.group,
          difficulty,type:'All',source:'All',minutes:20
        });
      }
    }
  }

  // Separate built-in diagram tests.
  for(const subject of ['Biology','Chemistry','Physics']){
    for(const difficulty of diffs){
      for(let n=1;n<=4;n++){
        tests.push({id:id++,scope:'Diagram',name:`${subject} Diagram ${difficulty} Test ${n}`,subject,difficulty,type:'Diagram',source:'All',minutes:20});
      }
    }
  }

  // PYQ-pattern tests (paraphrased).
  for(const subject of ['Biology','Chemistry','Physics']){
    for(const difficulty of diffs){
      for(let n=1;n<=4;n++){
        tests.push({id:id++,scope:'PYQ',name:`${subject} PYQ Pattern ${difficulty} Test ${n}`,subject,difficulty,type:'All',source:'PYQ Pattern (Paraphrased)',minutes:20});
      }
    }
  }
  return tests;
}

function uniqueByBaseAndText(list){
  const bases=new Set(),texts=new Set(),out=[];
  for(const q of list.slice().sort(()=>Math.random()-.5)){
    const b=String(q.baseId||q.id),t=String(q.q||'').trim().toLowerCase().replace(/\s+/g,' ');
    if(bases.has(b)||texts.has(t))continue;

function az11SeededRandom(seed){
  let a=seed>>>0;
  return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296}
}
function az11SeededShuffle(list,seed){
  const out=list.map(clone),rnd=az11SeededRandom(seed);
  for(let i=out.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[out[i],out[j]]=[out[j],out[i]]}
  return out;
}
function az11UniqueStable(list){
  const bases=new Set(),texts=new Set(),out=[];
  for(const q of list){
    const b=String(q.baseId||q.id),t=String(q.q||'').trim().toLowerCase().replace(/\s+/g,' ');
    if(!t||bases.has(b)||texts.has(t))continue;
    bases.add(b);texts.add(t);out.push(q);
  }
  return out;
}
function startFullNeet180(testNo=1){
  testNo=Math.max(1,Math.min(120,Number(testNo)||1));
  // Do NOT discard the built-in 180-question bank through chapter normalization.
  // This guarantees every Full Test opens even when the owner has uploaded zero questions.
  const raw=[...AZ11_FULL_BANK,...QUESTION_BANK.filter(q=>q.type!=='Diagram'),...getRemoteQuestions()];
  const all=raw.map(q=>normalizeQuestion(q)||q).filter(Boolean);
  const sections=['Physics','Chemistry','Botany','Zoology'],picked=[];
  sections.forEach((sec,si)=>{
    let pool=az11UniqueStable(all.filter(q=>questionSection(q)===sec));
    // Built-in section questions are always included as a safety fallback.
    const fallback=AZ11_FULL_BANK.filter(q=>questionSection(q)===sec);
    pool=az11UniqueStable([...pool,...fallback]);
    const part=az11SeededShuffle(pool,4571100+testNo*1009+si*7919).slice(0,45);
    if(part.length<45){toast(`${sec}: question bank needs at least 45 questions.`);return}
    picked.push(...part);
  });
  if(picked.length!==180){toast('Full Test bank is still syncing. Reopen once.');return}
  const ordered=[];
  for(const [si,sec] of sections.entries()){
    const part=picked.filter(q=>questionSection(q)===sec);
    ordered.push(...az11SeededShuffle(part,880000+testNo*313+si*37));
  }
  startExam(`AZ11 NEET Full Mock ${testNo} • 180 Questions`,ordered,180,{mode:'full',lockMode:true,meta:{testNo}});
}

function pdfAnswerTokens(t){
  if(Array.isArray(t?.answerKeyTokens)&&t.answerKeyTokens.length){
    return t.answerKeyTokens.map(x=>String(x||'').toUpperCase());
  }
  const legacy=String(t?.answerKey||'').toUpperCase().replace(/[^ABCD]/g,'');
  return [...legacy];
}
function startPdfTest(id){
  const t=getPdfTests().find(x=>String(x.id)===String(id));
  if(!t)return toast('PDF test not found. Sync again.');
  const tokens=pdfAnswerTokens(t);
  const count=Math.max(1,Math.min(180,Number(t.count)||tokens.length));
  if(tokens.length<count)return toast('This PDF test has an incomplete answer key.');

  const qs=Array.from({length:count},(_,i)=>{
    const token=String(tokens[i]||'').toUpperCase();
    const dropped=token==='DROP';
    const validAnswers=dropped?[]:token.split('/').filter(x=>/^[ABCD]$/.test(x)).map(x=>x.charCodeAt(0)-65);
    const a=validAnswers.length?validAnswers[0]:0;
    return {
      id:Number(String(t.id).replace(/\D/g,'').slice(-9)||Date.now())*1000+i+1,
      baseId:`pdf-${t.id}-${i+1}`,
      subject:t.subject==='NEET Full Paper'?'PCB Mixed':(t.subject||'PDF Test'),
      paperSection:t.subject||'PDF Test',
      class:'11/12',chapter:t.title||'PDF Test',topic:'PDF Paper',sub:'Owner PDF Test',
      difficulty:'Hard',type:'PDF',source:'Owner PDF Test',
      q:dropped?`Question ${i+1} is marked DROP in the answer key.`:`Refer to the PDF paper and answer Question ${i+1}.`,
      o:['A','B','C','D'],a,validAnswers,dropped,
      e:dropped?'Dropped question: +4 marks are awarded automatically.':`Accepted answer: ${token}. Detailed explanation is not included with this PDF test.`,
      concept:t.title||'PDF Test',imageOptionsOnly:true,pdfTestId:String(t.id)
    }
  });
  startExam(t.title||'AZ11 PDF Test',qs,Math.max(1,Number(t.minutes)||count));
  state.exam.pdfTest={id:String(t.id),title:t.title||'PDF Test',fileName:t.fileName||'paper.pdf'};
  saveSession();render();
}

function pickQuestions(filters={},count=20){
  const match=(q,relaxDifficulty=false)=>
    (!filters.subject||q.subject===filters.subject)&&
    (!filters.class||q.class===filters.class)&&
    (!filters.chapter||q.chapter===filters.chapter)&&
    (!filters.topic||q.topic===filters.topic)&&
    (relaxDifficulty||!filters.difficulty||q.difficulty===filters.difficulty)&&
    (!filters.type||q.type===filters.type)&&
    (!filters.source||q.source===filters.source);

  let pool=allQuestions().filter(q=>match(q,false));
  if(pool.length<count)pool=allQuestions().filter(q=>match(q,true));
  if(filters.chapter && !pool.length){toast('No questions available for this chapter yet.');return []}

  const groups=new Map(),exact=new Set();
  for(const q of pool){
    const textKey=String(q.q||'').trim().toLowerCase().replace(/\s+/g,' ');
    if(exact.has(textKey))continue;
    exact.add(textKey);
    const key=String(q.baseId||q.id);
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(q);
  }
  const g=[...groups.values()].sort(()=>Math.random()-.5),picked=[];
  for(const group of g){
    picked.push(clone(group[Math.floor(Math.random()*group.length)]));
    if(picked.length>=count)break;
  }
  if(picked.length<count)toast(`${picked.length} unique questions available — repeats were not added.`);
  return picked.map((x,i)=>({...x,runId:i+1}));
}

function startExam(name,questions,minutes,opts={}){
  if(!questions||!questions.length)return;
  state.exam={name,questions,minutes,mode:opts.mode||'',lockMode:!!opts.lockMode,meta:opts.meta||{}};
  state.current=0;
  state.answers=new Array(questions.length).fill(null);
  state.review=new Array(questions.length).fill(false);
  state.visited=new Array(questions.length).fill(false);
  state.visited[0]=true;
  state.questionTime=new Array(questions.length).fill(0);
  state.questionStartedAt=Date.now();
  state.seconds=minutes*60;
  state.deadline=Date.now()+state.seconds*1000;
  state.page='exam';
  if(state.exam.lockMode){try{history.pushState({az11ExamLock:true},'',location.href)}catch(e){}}
  saveSession();
  render();
  runTimer();
}
function runTimer(){
  if(state.timer)clearInterval(state.timer);
  if(!state.exam||state.page!=='exam')return;
  syncExamClock();
  if(state.seconds<=0){submitExam(true);return}
  state.timer=setInterval(()=>{
    syncExamClock();
    const el=document.getElementById('timer');
    if(el)el.textContent=formatTime(state.seconds);
    if(state.seconds<=0){
      clearInterval(state.timer);state.timer=null;
      saveSession();
      submitExam(true);
    }
  },1000);
}
function formatTime(s){
  s=Math.max(0,s);
  const m=Math.floor(s/60),ss=s%60;
  return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`
}

function submitExam(auto=false){
  if(!auto&&!confirm('Submit the test now?'))return;
  trackCurrentQuestionTime();
  if(state.timer){clearInterval(state.timer);state.timer=null}
  syncExamClock();
  const examMeta={mode:state.exam?.mode||'',lockMode:!!state.exam?.lockMode,meta:state.exam?.meta||{}};
  const qs=state.exam.questions;
  let correct=0,wrong=0,unattempted=0;
  const details=qs.map((q,i)=>{
    const ans=state.answers[i];
    let status='unattempted';
    if(q.dropped){correct++;status='correct'}
    else if(ans===null)unattempted++;
    else if(Array.isArray(q.validAnswers)&&q.validAnswers.length?q.validAnswers.includes(ans):ans===q.a){correct++;status='correct'}
    else{wrong++;status='wrong'}
    return{q,ans,status,timeSpent:Number(state.questionTime[i]||0)};
  });
  const score=correct*4-wrong;
  const used=Math.max(0,state.exam.minutes*60-state.seconds);
  const accuracy=Math.round(correct/qs.length*100);
  const timeBonus=Math.max(0,Math.min(80,Math.floor(state.seconds/15)));
  const points=Math.max(0,correct*20-wrong*5+(accuracy>=90?120:accuracy>=80?70:accuracy>=70?35:0)+timeBonus);
  const now=Date.now();
  const result={id:now,completedAt:now,name:state.exam.name,date:new Date().toLocaleString(),score,correct,wrong,unattempted,total:qs.length,accuracy,used,points,mode:examMeta.mode,examMeta:examMeta.meta,details};

  if(examMeta.mode==='revision')updateRevisionAfterResult(details,now);
  else scheduleWrongQuestions(details,now);

  const arr=getResults();arr.push(result);saveResults(arr);
  state.lastResult=result;
  syncAttemptToAccount(result);
  clearSavedExam();
  state.page='result';
  saveSession();
  render();
}

function parseCsvLine(line){
  const out=[];let cur='',quoted=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){
      if(quoted && line[i+1]==='"'){cur+='"';i++}
      else quoted=!quoted;
    }else if(ch===',' && !quoted){out.push(cur);cur=''}
    else cur+=ch;
  }
  out.push(cur);
  return out.map(x=>x.trim());
}
function answerIndex(v){
  const s=String(v??'').trim().toUpperCase();
  if(['A','B','C','D'].includes(s))return s.charCodeAt(0)-65;
  const n=Number(s);
  if(Number.isInteger(n) && n>=0 && n<=3)return n;
  if(Number.isInteger(n) && n>=1 && n<=4)return n-1;
  return 0;
}
function normalizeImportedQuestion(x,i=0){
  const options=Array.isArray(x.options)?x.options:
    Array.isArray(x.o)?x.o:
    [x.A??x.a_text??x.optionA??x.option_a,x.B??x.b_text??x.optionB??x.option_b,x.C??x.c_text??x.optionC??x.option_c,x.D??x.d_text??x.optionD??x.option_d];
  const q=String(x.q??x.question??x.Question??'').trim();
  if(!q)return null;
  const cleanOpts=options.map(v=>String(v??'').trim());
  if(cleanOpts.some(v=>!v))return null;
  const id=12000000+Date.now()+i;
  return {
    id,baseId:id,
    subject:String(x.subject??x.Subject??'Biology').trim()||'Biology',
    class:String(x.class??x.Class??'12').trim()||'12',
    chapter:String(x.chapter??x.Chapter??'Imported Questions').trim()||'Imported Questions',
    topic:String(x.topic??x.Topic??'Imported File').trim()||'Imported File',
    sub:'Bulk Imported',
    difficulty:String(x.difficulty??x.Difficulty??'Hard').trim()||'Hard',
    type:String(x.type??x.Type??'Theory').trim()||'Theory',
    source:String(x.source??x.Source??'Admin File Import').trim()||'Admin File Import',
    q, o:cleanOpts,
    a:answerIndex(x.answer??x.correct??x.ans??x.Answer??x.Correct),
    e:String(x.explanation??x.Explanation??'Explanation not added.').trim()||'Explanation not added.',
    concept:String(x.concept??x.Concept??'Imported concept').trim()||'Imported concept'
  };
}
function parseImportedJson(raw){
  const data=JSON.parse(raw);
  const arr=Array.isArray(data)?data:(Array.isArray(data.questions)?data.questions:[]);
  return arr.map(normalizeImportedQuestion).filter(Boolean);
}
function parseImportedCsv(raw){
  const lines=raw.replace(/\r/g,'').split('\n').filter(x=>x.trim());
  if(lines.length<2)return [];
  const head=parseCsvLine(lines[0]).map(x=>x.toLowerCase());
  return lines.slice(1).map((line,i)=>{
    const vals=parseCsvLine(line),obj={};
    head.forEach((h,j)=>obj[h]=vals[j]??'');
    return normalizeImportedQuestion({
      question:obj.question||obj.q,
      A:obj.a||obj.optiona||obj.option_a,
      B:obj.b||obj.optionb||obj.option_b,
      C:obj.c||obj.optionc||obj.option_c,
      D:obj.d||obj.optiond||obj.option_d,
      answer:obj.answer||obj.correct||obj.ans,
      subject:obj.subject,class:obj.class,chapter:obj.chapter,topic:obj.topic,
      difficulty:obj.difficulty,type:obj.type,explanation:obj.explanation,concept:obj.concept
    },i);
  }).filter(Boolean);
}
function parseImportedTxt(raw){
  const blocks=raw.replace(/\r/g,'').split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);
  const result=[];
  blocks.forEach((block,i)=>{
    const lines=block.split('\n').map(x=>x.trim()).filter(Boolean);
    const obj={};
    const qLines=[];
    for(const line of lines){
      let m;
      if((m=line.match(/^(?:Q(?:uestion)?\s*[:.)-]?\s*)(.+)$/i)))obj.question=m[1];
      else if((m=line.match(/^A\s*[:.)-]\s*(.+)$/i)))obj.A=m[1];
      else if((m=line.match(/^B\s*[:.)-]\s*(.+)$/i)))obj.B=m[1];
      else if((m=line.match(/^C\s*[:.)-]\s*(.+)$/i)))obj.C=m[1];
      else if((m=line.match(/^D\s*[:.)-]\s*(.+)$/i)))obj.D=m[1];
      else if((m=line.match(/^(?:Ans(?:wer)?|Correct)\s*[:.)-]\s*([ABCD1-4])$/i)))obj.answer=m[1];
      else if((m=line.match(/^Subject\s*:\s*(.+)$/i)))obj.subject=m[1];
      else if((m=line.match(/^Class\s*:\s*(.+)$/i)))obj.class=m[1];
      else if((m=line.match(/^Chapter\s*:\s*(.+)$/i)))obj.chapter=m[1];
      else if((m=line.match(/^Topic\s*:\s*(.+)$/i)))obj.topic=m[1];
      else if((m=line.match(/^Difficulty\s*:\s*(.+)$/i)))obj.difficulty=m[1];
      else if((m=line.match(/^Explanation\s*:\s*(.+)$/i)))obj.explanation=m[1];
      else if(!obj.question)qLines.push(line);
    }
    if(!obj.question && qLines.length)obj.question=qLines.join(' ');
    const q=normalizeImportedQuestion(obj,i);
    if(q)result.push(q);
  });
  return result;
}
async function importQuestionFile(file){
  if(!file){toast('Choose a JSON, CSV or TXT file');return}
  const name=file.name.toLowerCase();
  if(!(name.endsWith('.json')||name.endsWith('.csv')||name.endsWith('.txt'))){
    toast('Use JSON, CSV or TXT for bulk question import');
    return;
  }
  try{
    const raw=await file.text();
    let qs=[];
    if(name.endsWith('.json'))qs=parseImportedJson(raw);
    else if(name.endsWith('.csv'))qs=parseImportedCsv(raw);
    else qs=parseImportedTxt(raw);
    if(!qs.length){toast('No valid A/B/C/D questions found in this file');return}
    const existing=getCustom();
    const merged=[...existing,...qs];
    saveCustom(merged);
    saveSession();
    const s=document.getElementById('importStatus');
    if(s)s.innerHTML=`<b>${qs.length} questions imported successfully.</b> They are now in My Added Questions.`;
    toast(`${qs.length} questions imported`);
  }catch(e){
    toast('Could not read this question file');
  }
}

/* Notes attachment cache for offline viewing */
function notesSyncDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('neet_abhi_synced_notes_files_v1',1);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains('files'))db.createObjectStore('files',{keyPath:'noteId'});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function cacheSyncedNoteFile(noteId,blob,name,type){
  try{
    const db=await notesSyncDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction('files','readwrite');
      tx.objectStore('files').put({noteId,name:name||'note-file',type:type||blob.type||'application/octet-stream',blob});
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
    });
    db.close();
  }catch(e){}
}
async function getCachedSyncedNoteFile(noteId){
  try{
    const db=await notesSyncDB();
    const out=await new Promise((resolve,reject)=>{
      const tx=db.transaction('files','readonly');
      const req=tx.objectStore('files').get(noteId);
      req.onsuccess=()=>resolve(req.result||null);
      req.onerror=()=>reject(req.error);
    });
    db.close();
    return out;
  }catch(e){return null}
}

async function syncNotesFromOwner(showToast=false){
  if(!(location.protocol==='https:'||location.hostname==='localhost')){
    if(showToast)toast('Online Notes sync works from the hosted Netlify app.');
    return false;
  }
  try{
    const r=await fetch('/api/notes?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=await r.json();
    const arr=Array.isArray(data)?data:(Array.isArray(data.notes)?data.notes:[]);
    saveSyncedNotes(arr);
    if(showToast)toast(`Synced ${arr.length} notes`);
    return true;
  }catch(e){
    if(showToast)toast('Could not sync notes. Showing saved offline notes.');
    return false;
  }
}

async function loadSyncedNoteAttachment(note){
  const box=document.querySelector(`[data-synced-note-file="${note.id}"]`);
  if(!box||!note.hasFile)return;

  let cached=await getCachedSyncedNoteFile(note.id);
  if(!cached && navigator.onLine){
    try{
      const r=await fetch(`/api/note-file?id=${encodeURIComponent(note.id)}&ts=${Date.now()}`,{cache:'no-store'});
      if(r.ok){
        const blob=await r.blob();
        cached={noteId:note.id,name:note.fileName||'note-file',type:note.fileType||blob.type,blob};
        await cacheSyncedNoteFile(note.id,blob,cached.name,cached.type);
      }
    }catch(e){}
  }

  if(!cached){
    box.innerHTML=`<div class="note-file-name">📎 ${esc(note.fileName||'Attachment')}</div><div class="small muted">Attachment is not cached on this device yet.</div>`;
    return;
  }

  const type=cached.type||cached.blob.type||'';
  const url=URL.createObjectURL(cached.blob);
  if(type.startsWith('image/')){
    box.innerHTML=`<div class="note-file-name">🖼️ ${esc(cached.name||note.fileName||'Image')}</div><img src="${url}" alt="Synced note image">`;
  }else{
    const mb=(cached.blob.size/1024/1024).toFixed(2);
    box.innerHTML=`<div class="note-file-name">📎 ${esc(cached.name||note.fileName||'Attachment')}</div><div class="small muted">${esc(type||'File')} • ${mb} MB</div>`;
  }
  box.dataset.objectUrl=url;
}

async function renderSyncedNoteAttachments(){
  const notes=getSyncedNotes();
  for(const note of notes){
    if(note.hasFile)await loadSyncedNoteAttachment(note);

        cached={noteId:note.id,name:note.fileName||'note-file',type:note.fileType||blob.type,blob};
        await cacheSyncedNoteFile(note.id,blob,cached.name,cached.type);
      }
    }catch(e){}
  }
  if(!cached){toast('Attachment is not available offline yet');return}
  const url=URL.createObjectURL(cached.blob);
  const w=window.open(url,'_blank');
  if(!w)location.href=url;
  setTimeout(()=>URL.revokeObjectURL(url),120000);
}

async function downloadSyncedNoteFile(id){
  const note=getSyncedNotes().find(n=>String(n.id)===String(id));
  if(!note){toast('Note not found');return}
  let cached=await getCachedSyncedNoteFile(note.id);
  if(!cached && navigator.onLine){
    try{
      const r=await fetch(`/api/note-file?id=${encodeURIComponent(note.id)}&ts=${Date.now()}`,{cache:'no-store'});
      if(r.ok){
        const blob=await r.blob();
        cached={noteId:note.id,name:note.fileName||'note-file',type:note.fileType||blob.type,blob};
        await cacheSyncedNoteFile(note.id,blob,cached.name,cached.type);
      }
    }catch(e){}
  }
  if(!cached){toast('Attachment is not available offline yet');return}
  const url=URL.createObjectURL(cached.blob);
  const a=document.createElement('a');
  a.href=url;a.download=cached.name||note.fileName||'note-file';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

let friendGameRoom=null;
let friendGamePoll=null;
let friendGameLastReactionId='';
let FRIEND_GAME_BANK_CACHE=null;

const FRIEND_GAME_CODE_KEY='az11_friend_game_code_v1';
const FRIEND_GAME_EMOJIS=['😂','🔥','😎','😜','👀','💪'];

function stopFriendGamePolling(){
  if(friendGamePoll){clearInterval(friendGamePoll);friendGamePoll=null}
}

function friendGameBank(){
  if(FRIEND_GAME_BANK_CACHE)return FRIEND_GAME_BANK_CACHE;

  // Stable built-in AZ11 bank only, so both phones always have the exact same question data.
  // QUESTION_BANK currently provides 2604 generated practice questions; AZ11_FULL_BANK adds 180.
  const raw=[...QUESTION_BANK.filter(q=>q.type!=='Diagram'),...AZ11_FULL_BANK];
  const seen=new Set(),out=[];

  for(const src of raw){
    const q=normalizeQuestion(src)||src;
    if(!q||!Array.isArray(q.o)||q.o.length!==4||!Number.isInteger(Number(q.a)))continue;
    const id=String(q.id);
    if(seen.has(id))continue;
    seen.add(id);
    out.push(q);
  }

  FRIEND_GAME_BANK_CACHE=out;
  return out;
}

function friendGameQuestionById(id){
  return friendGameBank().find(q=>String(q.id)===String(id))||null;
}

function randomGameSeed(){
  try{
    if(crypto?.getRandomValues){
      const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]>>>0;
    }
  }catch(e){}
  return (Date.now()^(Math.random()*0xffffffff))>>>0;
}

function makeFriendGameSet(chapter=''){
  const bank=friendGameBank();
  const seed=randomGameSeed();
  if(chapter){
    const pool=az11SeededShuffle(bank.filter(q=>q.chapter===chapter),seed);
    const seen=new Set(),picked=[];
    for(const q of pool){
      const text=String(q.q||'').trim().toLowerCase().replace(/\s+/g,' ');
      if(!text||seen.has(text))continue;
      seen.add(text);picked.push(q);
      if(picked.length===20)break;
    }
    return az11SeededShuffle(picked,seed+777);
  }
  const sections=['Physics','Chemistry','Botany','Zoology'];
  const picked=[];
  const usedBase=new Set();

  // Keep the game balanced: 5 Physics + 5 Chemistry + 5 Botany + 5 Zoology.
  for(const [si,sec] of sections.entries()){
    const pool=az11SeededShuffle(bank.filter(q=>questionSection(q)===sec),seed+si*7919);
    let n=0;
    for(const q of pool){
      const base=String(q.baseId||q.id);
      if(usedBase.has(base))continue;
      usedBase.add(base);
      picked.push(q);
      n++;
      if(n===5)break;
    }
  }

  // Safety fallback if any section is temporarily short.
  if(picked.length<20){
    const rest=az11SeededShuffle(bank,seed+99173);
    for(const q of rest){
      const base=String(q.baseId||q.id);
      if(usedBase.has(base))continue;
      usedBase.add(base);
      picked.push(q);
      if(picked.length===20)break;
    }
  }

  return az11SeededShuffle(picked.slice(0,20),seed+777);
}

async function friendGameApi(body=null,code=''){
  const url='/api/game'+(code?`?code=${encodeURIComponent(code)}`:'');
  const opt=body
    ?{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)}
    :{cache:'no-store',credentials:'same-origin'};
  const r=await fetch(url,opt),d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||`Game HTTP ${r.status}`);
  return d;
}

function absorbFriendReaction(room,showToast=true){
  if(!room||!accountState.user)return;
  const mine=(room.reactions||[]).filter(x=>x.to===accountState.user.username);
  const last=mine[mine.length-1];
  if(!last||last.id===friendGameLastReactionId)return;
  friendGameLastReactionId=last.id;
  if(showToast && Date.now()-Number(last.at||0)<20000){
    toast(`${last.emoji} ${last.fromDisplayName||last.from} sent you ${last.emoji}`);
  }
}

async function createFriendGame(chapter=''){
  if(!accountState.user){toast('Login to Account first.');go('account');return}
  chapter=chapter||document.getElementById('friendChapter')?.value||'';
  const qs=makeFriendGameSet(chapter);
  if(qs.length!==20){toast('Game question bank is still loading. Reopen once.');return}

  try{
    const d=await friendGameApi({
      action:'create',
      questionIds:qs.map(q=>String(q.id)),
      correctAnswers:qs.map(q=>Number(q.a)),
      label:chapter?`Chapter Challenge • ${chapter}`:'Random PCB Challenge'
    });
    friendGameRoom=d.room;
    friendGameLastReactionId='';
    localStorage.setItem(FRIEND_GAME_CODE_KEY,d.room.code);
    render();
    startFriendGamePolling();
  }catch(e){toast(e.message)}
}

async function joinFriendGame(){
  if(!accountState.user){toast('Login to Account first.');go('account');return}
  const code=(document.getElementById('friendCode')?.value||'').trim().toUpperCase();
  if(!code)return toast('Enter game code.');

  try{
    const d=await friendGameApi({action:'join',code});
    friendGameRoom=d.room;
    friendGameLastReactionId='';
    localStorage.setItem(FRIEND_GAME_CODE_KEY,code);
    absorbFriendReaction(d.room,false);
    render();
    startFriendGamePolling();
  }catch(e){toast(e.message)}
}

async function refreshFriendGame(silent=true){
  const code=friendGameRoom?.code||localStorage.getItem(FRIEND_GAME_CODE_KEY)||'';
  if(!code)return false;

  try{
    const d=await friendGameApi(null,code);
    absorbFriendReaction(d.room,true);
    friendGameRoom=d.room;
    if(state.page==='friendgame')render();
    return true;
  }catch(e){
    friendGameRoom=null;
    friendGameLastReactionId='';
    localStorage.removeItem(FRIEND_GAME_CODE_KEY);
    if(!silent)toast(e.message);
    if(state.page==='friendgame')render();
    return false;
  }
}

function startFriendGamePolling(){
  if(friendGamePoll||state.page!=='friendgame'||!friendGameRoom?.code)return;
  friendGamePoll=setInterval(()=>{
    if(state.page==='friendgame')refreshFriendGame(true);
    else stopFriendGamePolling()
  },2500);
}

async function leaveFriendGame(){
  const code=friendGameRoom?.code||localStorage.getItem(FRIEND_GAME_CODE_KEY)||'';
  try{if(code)await friendGameApi({action:'leave',code})}catch(e){}
  stopFriendGamePolling();
  friendGameRoom=null;
  friendGameLastReactionId='';
  localStorage.removeItem(FRIEND_GAME_CODE_KEY);
  render();
}


async function rematchFriendGame(){
  const oldCode=friendGameRoom?.code||'';
  try{
    if(oldCode)await friendGameApi({action:'leave',code:oldCode});
  }catch(e){}
  stopFriendGamePolling();
  friendGameRoom=null;
  friendGameLastReactionId='';
  localStorage.removeItem(FRIEND_GAME_CODE_KEY);
  await createFriendGame();
}

async function answerFriendGame(index,choice){
  if(!friendGameRoom?.code)return;
  try{
    const d=await friendGameApi({action:'answer',code:friendGameRoom.code,index,choice});
    friendGameRoom=d.room;
    absorbFriendReaction(d.room,true);
    toast(d.point===1?'✅ Correct • +1 point':'❌ Wrong • 0 point');
    render();
    startFriendGamePolling();
  }catch(e){toast(e.message)}
}

async function sendFriendEmoji(emoji){
  if(!friendGameRoom?.code||!FRIEND_GAME_EMOJIS.includes(emoji))return;
  try{
    const d=await friendGameApi({action:'react',code:friendGameRoom.code,emoji});
    friendGameRoom=d.room;
    toast(`${emoji} sent!`);
    render();
    startFriendGamePolling();
  }catch(e){toast(e.message)}
}

async function copyFriendGameCode(){
  const code=friendGameRoom?.code||'';
  if(!code)return;
  try{
    await navigator.clipboard.writeText(code);
    toast('Game code copied ✅');
  }catch(e){
    try{
      const t=document.createElement('textarea');t.value=code;document.body.appendChild(t);
      t.select();document.execCommand('copy');t.remove();toast('Game code copied ✅');
    }catch(_){toast(`Game code: ${code}`)}
  }
}

function accountPage(){
  if(accountState.user){
    const a=accountState.attempts.slice().reverse().slice(0,20);
    return layout(`<h1 class="page-title">👤 My Account</h1>
      <div class="card">
        <h2>${esc(accountState.user.displayName||accountState.user.username)}</h2>
        <p class="muted">@${esc(accountState.user.username)} • Progress is synced to AZ11 when online.</p>
        <div class="notes-toolbar">
          <button class="btn secondary" onclick="loadServerAttempts().then(()=>render())">Refresh Progress</button>
          <button class="btn red" onclick="logoutAccount()">Log Out</button>
        </div>
      </div>
      <h2>Synced Test Attempts</h2>
      ${a.length?a.map(x=>`<div class="user-attempt"><b>${esc(x.name)}</b><br><span class="small muted">${esc(x.date||'')}</span><p>Score: <b>${x.score}/${x.total*4}</b> • Accuracy: <b>${x.accuracy}%</b></p></div>`).join(''):'<div class="card empty">No synced attempts yet.</div>'}`)
  }
  return layout(`<h1 class="page-title">👤 Account</h1>
    <div class="login-grid">
      <div class="card">
        <h2>Login</h2>
        <div class="form">
          <label>Username<input id="loginUser" autocomplete="username" placeholder="username"></label>
          <label>Password<input id="loginPass" type="password" autocomplete="current-password" placeholder="password"></label>
          <button class="btn" onclick="loginAccount()">Login</button>
        </div>
      </div>
      <div class="card">
        <h2>Create Account</h2>
        <div class="form">
          <label>Name<input id="regName" placeholder="Display name"></label>
          <label>Username<input id="regUser" autocomplete="username" placeholder="3–20 letters/numbers/_"></label>
          <label>Password<input id="regPass" type="password" autocomplete="new-password" placeholder="Minimum 6 characters"></label>
          <button class="btn green" onclick="registerAccount()">Create Account</button>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:16px"><span class="small muted">Passwords are stored as secure hashes on the server. The AZ11 owner can see usernames and progress, not passwords.</span></div>`)
}

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    syncExamClock();
    saveSession();
    if(state.timer){clearInterval(state.timer);state.timer=null}
  }else if(state.page==='exam'&&state.exam){
    syncExamClock();
    saveSession();
    if(state.seconds<=0)setTimeout(()=>submitExam(true),50);
    else{render();runTimer()}
  }
});
window.addEventListener('pagehide',()=>{trackCurrentQuestionTime();syncExamClock();saveSession()});
window.addEventListener('beforeunload',e=>{
  trackCurrentQuestionTime();syncExamClock();saveSession();
  if(state.page==='exam'&&state.exam?.lockMode){e.preventDefault();e.returnValue=''}
});
window.addEventListener('popstate',()=>{
  if(state.page==='exam'&&state.exam?.lockMode){
    try{history.pushState({az11ExamLock:true},'',location.href)}catch(e){}
    toast('🔒 Exam Lock Mode: use Submit or Exit Test.');
  }
});


window.addEventListener('online',()=>{
  syncNotesFromOwner(false).then(ok=>{
    if(ok && state.page==='notes'){render();setTimeout(renderSyncedNoteAttachments,0)}
  });
});


async function syncAZ11Content(){
  if(!navigator.onLine)return;
  const [nq,nn,np]=await Promise.all([syncRemoteQuestions(false),syncNotesFromOwner(false),syncPdfTests(false)]);
  if((nq||nn||np)&&state.page!=='exam'&&state.page!=='result')render();
  if(accountState.user)syncPendingAttempts();
}
window.addEventListener('online',()=>syncAZ11Content());
setInterval(()=>{if(document.visibilityState==='visible')syncAZ11Content()},300000);

function render(){
  document.body.style.overflow='';
  let html='';
  if(state.page==='dashboard')html=dashboard();
  else if(state.page==='dailyplan')html=dailyPlanPage();
  else if(state.page==='weak')html=weakTopicPage();
  else if(state.page==='revision')html=revisionPage();
  else if(state.page==='analysis')html=fullAnalysisPage();
  else if(state.page==='fulltests'||state.page==='tests')html=fullTestsPage();
  else if(state.page==='chaptertests')html=chapterTestsPage();
  else if(state.page==='diagrams')html=diagramsPage();
  else if(state.page==='pdftests')html=pdfTestsPage();
  else if(state.page==='pyq')html=pyqPage();
  else if(state.page==='custom')html=customPage();
  else if(state.page==='friendgame')html=friendGamePage();
  else if(state.page==='performance')html=performancePage();
  else if(state.page==='history')html=historyPage();
  else if(state.page==='wrong')html=wrongPage();
  else if(state.page==='bookmarks')html=bookmarksPage();
  else if(state.page==='notes')html=notesPage();
  else if(state.page==='account')html=accountPage();
  else if(state.page==='about')html=aboutPage();
  else if(state.page==='exam')html=examPage();
  else if(state.page==='result')html=resultPage();
  document.getElementById('app').innerHTML=html;
  setTimeout(renderVisibleQuestionFiles,0);
  setTimeout(refreshInstallButton,0);
  if(state.page==='dashboard'||state.page==='performance')setTimeout(drawPerformanceGraph,0);
  if(state.page==='friendgame')setTimeout(startFriendGamePolling,0);else stopFriendGamePolling();
  if(state.page==='admin')setTimeout(toggleAdminOptions,0);
  if(state.page==='notes')setTimeout(renderSyncedNoteAttachments,0);
}
updateDailyStreak();
applyAZ11Theme();
getRevisionQueue();
restoreSession();
render();
Promise.all([syncNotesFromOwner(false),syncRemoteQuestions(false),syncPdfTests(false),loadAccount()]).then(()=>{
  if(state.page!=='exam'&&state.page!=='result')render();
  setTimeout(renderVisibleQuestionFiles,0);
  syncPendingAttempts();
  setTimeout(openInviteFromUrl,150);
});
syncNotesFromOwner(false).then(ok=>{
  if(ok && state.page==='notes'){render();setTimeout(renderSyncedNoteAttachments,0)}
});
if(state.page==='exam'&&state.exam){
  syncExamClock();
  if(state.seconds<=0)setTimeout(()=>submitExam(true),100);
  else runTimer();
}
</script>
</body>
</html>
